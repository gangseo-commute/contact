<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>출퇴근 버스 기사님 조회</title>
<style>
  :root{
    --bg:#14181F;          /* 야간 도로 아스팔트 */
    --panel:#1D232D;
    --line:#2B3340;
    --plate:#FFC400;       /* 영업용 번호판 노랑 */
    --plate-ink:#111111;
    --text:#E8EAED;
    --muted:#8B94A3;
    --ok:#38C97C;
    --err:#FF6B6B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:32px 16px 48px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%;max-width:420px}
  header{text-align:center;margin-bottom:28px}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:.18em;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:5px 14px;margin-bottom:14px
  }
  h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
  h1 em{font-style:normal;color:var(--plate)}
  .sub{margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.6}

  /* ─ 번호판 스타일 입력 ─ */
  .plate{
    background:var(--plate);
    border-radius:14px;
    padding:18px 20px 16px;
    box-shadow:0 6px 24px rgba(0,0,0,.45), inset 0 0 0 3px rgba(0,0,0,.85), inset 0 0 0 5px var(--plate);
    position:relative;
  }
  .plate .bolt{position:absolute;top:10px;width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.35)}
  .plate .bolt.l{left:12px}.plate .bolt.r{right:12px}
  .plate-label{font-size:11px;font-weight:700;color:rgba(0,0,0,.55);letter-spacing:.25em;text-align:center;margin-bottom:8px}
  .digits{display:flex;justify-content:center;gap:10px}
  .digits input{
    width:56px;height:68px;border:none;border-radius:8px;
    background:rgba(0,0,0,.08);
    color:var(--plate-ink);
    font-size:40px;font-weight:900;text-align:center;
    font-variant-numeric:tabular-nums;
    caret-color:var(--plate-ink);
    outline:none;
  }
  .digits input:focus{background:rgba(0,0,0,.16);box-shadow:0 0 0 3px rgba(0,0,0,.55)}
  button.go{
    width:100%;margin-top:16px;padding:15px;border:none;border-radius:12px;
    background:var(--panel);color:var(--text);
    font-size:16px;font-weight:800;letter-spacing:.02em;cursor:pointer;
    border:1px solid var(--line);
  }
  button.go:active{transform:scale(.985)}
  button.go:focus-visible,.digits input:focus-visible{outline:2px solid var(--plate);outline-offset:2px}

  .msg{margin-top:16px;text-align:center;font-size:14px;min-height:20px}
  .msg.err{color:var(--err)}
  .msg.wait{color:var(--muted)}

  /* ─ 결과 카드 ─ */
  .results{margin-top:20px;display:flex;flex-direction:column;gap:12px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px 18px 16px;animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card .role{font-size:12px;color:var(--plate);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
  .card .name{font-size:20px;font-weight:800}
  .card .memo{margin-top:4px;font-size:13px;color:var(--muted);line-height:1.5}
  .card a.tel{
    display:block;margin-top:14px;text-align:center;
    background:var(--plate);color:var(--plate-ink);
    border-radius:10px;padding:13px;font-size:16px;font-weight:900;
    text-decoration:none;letter-spacing:.04em;
  }

  footer{margin-top:40px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">삼성중공업-명지/에코델타시티/하단 출퇴근 버스 안내</div>
    <h1>기사님 <em>연락처 조회</em></h1>
    <p class="sub">버스 번호판 <strong>뒤 4자리</strong>를 입력하면<br>해당 차량 기사님 연락처가 표시됩니다.</p>
  </header>

  <div class="plate" role="group" aria-label="차량번호 뒤 4자리 입력">
    <span class="bolt l"></span><span class="bolt r"></span>
    <div class="plate-label">차량번호 뒤 4자리</div>
    <div class="digits">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="첫째 자리">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="둘째 자리">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="셋째 자리">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="넷째 자리">
    </div>
  </div>
  <button class="go" id="btnGo">조회하기</button>
  <div class="msg" id="msg" role="status"></div>
  <div class="results" id="results"></div>

  <footer>
    문의가 해결되지 않으면 총무에게 연락 주세요.
  </footer>
</div>

<script>
/* ───────────────────────────────────────────────
   암호화된 데이터. 아래 줄을 관리자 패널에서 복사한
   코드로 교체하면 됩니다. (연락처 원문은 저장되지 않음)
─────────────────────────────────────────────── */
const DATA = [{"s":"rIV5Qy5kH3ZESbhx6jVT8g==","i":"VtFlE86DTBI+Gm0v","c":"OEfP6Zxib+CraURVWCMtGFJ0gVeKPDbPfuW6gL3OKrke1Bl3B9mFuqQHp24NnE9pILaKv8gah6dsosAbzbpbtv9A95upRcxuOyME1MEffWY="},{"s":"NSAuwd7SBXopQffF+OQMGg==","i":"hum3Gx7doQrukvJP","c":"VaWglQcde9PyQrd23qdcfbzC0r/6/JYkiRn+647Zb3BbLysqMQSu5d0GrnV/8J9cPt8Im45mRoIIpwM3iUTqaGObPBG3udXkpWCSxN/FQM0="},{"s":"3nJ8uiCj2fZBQsBZxrtGbA==","i":"wy7DGLEX19p5zBEv","c":"CseaXd+gBCDXMgpeYRf1m2vIxGv+AsosfA4Lf/KsVnuKWvI4r520YvPFUli0FQv0hQ99zaf+qQ7sjkVJlQrCM9gB/IvjKkM9vC/rXHsgYyU="},{"s":"axjdZIiyDLoI2tjhDztXLg==","i":"0cAQj6WEU+Q4D5rE","c":"yCEl8p29LIySEwkH/zFnuH5RUEYTqtNxlWu6C1Ac24uljJ+y6lBGt3nlSuFinTEwGLPp1inTBXkLLBpij4qryW0hkoK29xYw8e00uLyUbQw="},{"s":"acNlwzOonPGW+EM06PX+Nw==","i":"TcriU2+yixDm/IBI","c":"NF3Kpnud1t4v6JPofjWS2Q2Pt8xBR+zOBQLNzpQqn5ZzqC/pvhbS6V7i6Fmh1CQLlezk4Wyf7zfpwZhPjCs6x77pO/Q93fvTUmQ9LS0fiCU="}];

const ITER = 150000;
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(plate, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(plate), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptEntry(plate, obj){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(plate, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return {s:b64(salt), i:b64(iv), c:b64(ct)};
}
async function tryDecrypt(plate, e){
  try{
    const key = await deriveKey(plate, unb64(e.s));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(e.i)}, key, unb64(e.c));
    return JSON.parse(dec.decode(pt));
  }catch{ return null; }
}

/* ─ 조회 UI ─ */
const boxes = [...document.querySelectorAll('.digits input')];
const msg = document.getElementById('msg');
const results = document.getElementById('results');

boxes.forEach((b,i)=>{
  b.addEventListener('input', ()=>{
    b.value = b.value.replace(/\D/g,'').slice(-1);
    if(b.value && i<3) boxes[i+1].focus();
    if(b.value && i===3) lookup();
  });
  b.addEventListener('keydown', e=>{
    if(e.key==='Backspace' && !b.value && i>0) boxes[i-1].focus();
    if(e.key==='Enter') lookup();
  });
});
document.getElementById('btnGo').addEventListener('click', lookup);

function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}

async function lookup(){
  const plate = boxes.map(b=>b.value).join('');
  results.innerHTML=''; msg.className='msg'; msg.textContent='';
  if(plate.length!==4){ msg.className='msg err'; msg.textContent='4자리를 모두 입력해 주세요.'; return; }
  if(!DATA.length){ msg.className='msg err'; msg.textContent='등록된 데이터가 없습니다. (관리자 문의)'; return; }
  msg.className='msg wait'; msg.textContent='확인 중…';
  const found = [];
  for(const e of DATA){
    const r = await tryDecrypt(plate, e);
    if(r) found.push(r);
  }
  if(!found.length){
    msg.className='msg err'; msg.textContent='해당 차량 번호로 등록된 기사님이 없습니다.';
    return;
  }
  msg.textContent='';
  for(const f of found){
    const telRaw = (f.phone||'').replace(/[^0-9+]/g,'');
    results.insertAdjacentHTML('beforeend', `
      <div class="card">
        <div class="role"> ${esc(plate)} 차량 기사님 정보</div>
        <div class="name">${esc(f.name)}</div>
        ${f.memo?`<div class="memo">${esc(f.memo)}</div>`:''}
        <a class="tel" href="tel:${telRaw}">📞 ${esc(f.phone)}</a>
      </div>`);
  }
}

</script>
</body>
</html>
